      - name: Logo (opcional, sube logo.png a la raiz del repo)
        run: |
          if [ -f logo.png ]; then
            sudo apt-get install -y imagemagick >/dev/null
            mkdir -p app/src/main/res/drawable
            convert logo.png -resize 192x192 app/src/main/res/drawable/ic_launcher.png
            convert logo.png -resize 256x256 app/src/main/assets/logo.png
            sed -i 's|android:label="ZetaBoost"|android:label="ZetaBoost" android:icon="@drawable/ic_launcher"|' app/src/main/AndroidManifest.xml
          fi
          sudo apt-get install -y imagemagick >/dev/null || true
          for f in tiktok discord; do if [ -f $f.png ]; then convert $f.png -resize 160x160 app/src/main/assets/$f.png; fi; done
          if [ -f banner.png ]; then convert banner.png -resize 1080x app/src/main/assets/banner.png; fi
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Firma fija
        run: |
          if [ ! -f zetaboost.jks ]; then
            keytool -genkeypair -keystore zetaboost.jks -alias zetaboost -keyalg RSA -keysize 2048 -validity 36500 -storepass ZetaBoost2026 -keypass ZetaBoost2026 -dname "CN=ZetaBoost, O=ZetaBoost, C=US"
            git config user.name github-actions
            git config user.email actions@github.com
            git add zetaboost.jks
            git commit -m "Firma ZetaBoost [skip ci]"
            git push
          fi
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.9}
      - run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }} -PvName=1.0.${{ github.run_number }}
      - run: mv app/build/outputs/apk/release/*.apk ZetaBoost.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: ZetaBoost v1.${{ github.run_number }}
          files: ZetaBoost.apk
